# Custom YOLO26 with P2 High-Resolution Head for Small Weapon Detection
# Parameters
nc: 1          # number of classes (weapon/knife)
scales:
  s: [0.50, 0.50, 1024] # Small model scale [depth, width, max_channels]

# Backbone (P1 - P5)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C2f, [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C2f, [256, True]]          # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C2f, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 1, C2f, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9

# Head with P2 Integration (Top-Down FPN & Bottom-Up PAN)
head:
  # --- Top-Down FPN ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10 (P5 -> P4)
  - [[-1, 6], 1, Concat, [1]]                  # 11 cat backbone P4
  - [-1, 2, C2f, [512]]                        # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13 (P4 -> P3)
  - [[-1, 4], 1, Concat, [1]]                  # 14 cat backbone P3
  - [-1, 2, C2f, [256]]                        # 15

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16 (P3 -> P2)
  - [[-1, 2], 1, Concat, [1]]                  # 17 cat backbone P2
  - [-1, 2, C2f, [128]]                        # 18 (P2 Top-Down)

  # --- Bottom-Up PAN ---
  - [-1, 1, Conv, [128, 3, 2]]                 # 19 (P2 -> P3)
  - [[-1, 15], 1, Concat, [1]]                 # 20 cat head P3
  - [-1, 2, C2f, [256]]                        # 21

  - [-1, 1, Conv, [256, 3, 2]]                 # 22 (P3 -> P4)
  - [[-1, 12], 1, Concat, [1]]                 # 23 cat head P4
  - [-1, 2, C2f, [512]]                        # 24

  - [-1, 1, Conv, [512, 3, 2]]                 # 25 (P4 -> P5)
  - [[-1, 9], 1, Concat, [1]]                  # 26 cat SPPF P5
  - [-1, 2, C2f, [1024]]                       # 27

  # Detect Head: inputs [P2 (18), P3 (21), P4 (24), P5 (27)]
  - [[18, 21, 24, 27], 1, Detect, [nc]]
